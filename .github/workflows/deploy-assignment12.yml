
name: Deploy Assignment 12

on:
  push:
    branches:
      - main
    paths:
      - 'Ahmed-shreif-Abdelaty-mon-thu-5-8-Assigment12-01004369345/**'
      - '.github/workflows/deploy-assignment12.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assignment12-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: Ahmed-shreif-Abdelaty-mon-thu-5-8-Assigment12-01004369345
        run: npm install

      - name: Build React App
        working-directory: Ahmed-shreif-Abdelaty-mon-thu-5-8-Assigment12-01004369345
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Ahmed-shreif-Abdelaty-mon-thu-5-8-Assigment12-01004369345/dist
          destination_dir: Ahmed-shreif-Abdelaty-mon-thu-5-8-Assigment12-01004369345
          keep_files: true
