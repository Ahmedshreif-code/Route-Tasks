<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Days+One&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body data-bs-theme="dark" class="bg-dark">
    <header>
      <nav
        id="Nav"
        class="navbar navbar-expand-lg bg-body border-bottom fixed-top py-3 fw-bolder"
      >
        <div class="container-fluid container-lg">
          <span
            class="navbar-brand primary-color text-xl font-bold"
            href="#home"
          >
            <i class="fa-solid fa-gamepad mr-2"></i>
            GameArena
          </span>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <i class="fa-solid fa-bars text-2xl"></i>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-bold">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#OUR-GAMES">OUR GAMES</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#What-We-Do">What We Do</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#Our-Team">Our Team</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#Contact-Us">Contact Us</a>
              </li>
            </ul>
            <hr class="d-lg-none" />
            <div class="row g-lg-5 align-content-center">
              <div class="col-12 col-lg-2">
                <div class="icon w-100 p-2">
                  <i class="fa-regular fa-bell text-lg"></i>
                  <span class="d-lg-none"> Notifications </span>
                </div>
              </div>
              <div class="col-12 col-lg-2">
                <div class="icon w-100 p-2">
                  <i class="fa-regular fa-message text-lg"></i>
                  <span class="d-lg-none"> Messages </span>
                </div>
              </div>
              <div class="col-12 col-lg-7">
                <button
                  class="btn btn-primary sign-btn fw-bolder btn-shine position-relative overflow-hidden w-100"
                  type="submit"
                >
                  Sign In
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <div data-bs-spy="scroll" data-bs-target="#Nav">
      <section id="home" class="position-relative">
        <div
          class="overlay w-100 h-100 bg-black bg-opacity-75 text-center text-lg-start justify-content-center align-content-center"
        >
          <div class="container">
            <div class="row align-items-center g-5">
              <div class="col-12 col-lg-6">
                <div class="title">
                  <h1>
                    THE ULTIMATE
                    <span class="primary-color d-block">GAMING</span> EXPERIENCE
                  </h1>
                  <p class="text-muted">
                    Join millions of gamers worldwide in the most competitive
                    eSports tournaments. Experience next-level gaming with
                    cutting-edge technology and endless possibilities.
                  </p>
                  <div class="row">
                    <div class="col-12 col-lg-5 d-lg-inline-block">
                      <button
                        class="btn btn-primary btn-shine position-relative overflow-hidden fw-bolder px-4 py-3 ms-2 my-2 d-block w-100"
                      >
                        Start Gaming Now
                      </button>
                    </div>
                    <div class="col-12 col-lg-5 d-lg-inline-block">
                      <button
                        class="btn btn-outline-primary btn-shine position-relative overflow-hidden fw-bolder px-4 py-3 ms-2 my-2 d-block w-100"
                      >
                        Watch Tournaments
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div class="img w-100">
                  <img
                    src="images/hero-img.png"
                    alt="hero-image"
                    class="w-100 h-100"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="OUR-GAMES" class=""></section>
      <section id="What-We-Do" class=""></section>
      <section id="Our-Team" class=""></section>
      <section id="Contact-Us" class=""></section>
    </div>
  </body>
</html>
